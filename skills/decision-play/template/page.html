<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>/*@TITLE@*/</title>
<style>
:root{--desk:#31505A;--desk2:#1F363F;--win:#262B2E;--mint:#5ECFA0;--amber:#E8B25C;--ink:#ECEFED;--dim:#A4AEAC;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;min-height:100dvh;background:linear-gradient(155deg,var(--desk),var(--desk2)) fixed;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}

.a-head{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px clamp(12px,2.5vw,24px);background:#14181A;border-bottom:1px solid var(--line)}
.a-head-title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32ch}
.a-head-ways{display:flex;gap:4px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.a-head-ways::-webkit-scrollbar{display:none}
.a-head-ways button{flex:none;height:32px;padding:0 12px;border:0;border-radius:7px;background:none;color:rgba(255,255,255,.66);font-weight:600;font-size:14px}
.a-head-ways button:hover{background:rgba(255,255,255,.07);color:#fff}
.a-head-ways button[aria-current=page]{background:rgba(255,255,255,.14);color:#fff}
.a-head-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.a-head-count{font-size:13px;color:rgba(255,255,255,.62);white-space:nowrap}
.a-head-copy{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);border-radius:7px;padding:5px 12px;font-size:14px;white-space:nowrap}
.a-head-copy:hover{background:rgba(255,255,255,.15)}
.a-band{margin:0;padding:8px clamp(16px,2.5vw,24px);background:#1A2023;color:#DDE3E0;font-size:14px;line-height:1.4;border-bottom:1px solid var(--line)}
.a-error{padding:40px 20px;max-width:640px;margin:0 auto}
.a-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#14181A;color:#fff;font-size:14px;padding:9px 16px;border-radius:9px;box-shadow:0 8px 28px rgba(0,0,0,.5);z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}
.a-toast.on{opacity:1}

.a-start{max-width:760px;margin:0 auto;padding:clamp(28px,6vh,64px) clamp(16px,4vw,40px) 80px}
.a-start h1{font-size:clamp(30px,4.2vw,44px);line-height:1.12;margin:0 0 14px;font-weight:700;letter-spacing:-.015em}
.a-start h2{font-size:21px;margin:40px 0 10px}
.a-start p{margin:0 0 12px}
.a-lead{font-size:18px;line-height:1.5;color:#DDE3E0}
.a-ways{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:22px 0 0}
.a-way{display:flex;flex-direction:column;gap:2px;text-align:left;padding:14px 16px;border:1px solid rgba(255,255,255,.16);border-radius:10px;background:rgba(0,0,0,.18)}
.a-way:hover{background:rgba(0,0,0,.3);border-color:rgba(255,255,255,.3)}
.a-way-title{font-weight:700;font-size:17px}
.a-way-when{font-size:13.5px;color:var(--amber)}
.a-way-does{font-size:14.5px;color:#C9D2CF;line-height:1.4;margin-top:4px}
.a-items{list-style:none;margin:0;padding:0}
.a-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 18px;align-items:start;padding:14px 0;border-top:1px solid rgba(255,255,255,.14)}
.a-item:last-child{border-bottom:1px solid rgba(255,255,255,.14)}
.a-item h3{margin:0 0 4px;font-size:17px;display:flex;gap:10px;align-items:baseline}
.a-nr{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:50%;background:var(--amber);color:#1a1a1a;font-size:13px;font-weight:700}
.a-item p{margin:0 0 6px;font-size:15.5px;color:#D5DDD9}
.a-item details{font-size:15px;color:#C9D2CF}
.a-item summary{cursor:pointer;color:var(--mint);font-size:14.5px}
.a-item details p{margin:6px 0 0}
.a-choice{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:290px}
.a-choice button{border:1px solid rgba(255,255,255,.3);background:none;border-radius:7px;padding:6px 13px;font-size:15px}
.a-choice button:hover{background:rgba(255,255,255,.08)}
.a-choice button[aria-pressed=true]{background:var(--mint);color:#16211c;border-color:var(--mint)}
.a-committed{margin-top:22px;border-top:1px solid rgba(255,255,255,.14);padding-top:12px}
.a-committed summary{cursor:pointer;font-weight:600}
.a-start-end{margin-top:30px;padding:18px 20px;border-radius:12px;background:rgba(0,0,0,.22)}
.a-small{font-size:14px;color:#B9C3C0;margin-top:26px}

.a-end{font-size:16px;line-height:1.45}
.a-end pre{white-space:pre-wrap;background:rgba(0,0,0,.28);color:#fff;padding:12px 14px;border-radius:8px;font:14.5px/1.5 ui-monospace,Menlo,monospace;margin:10px 0}
.a-end-buttons{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.a-end-rating{margin-top:14px}
.a-end button{border:1px solid currentColor;background:transparent;border-radius:7px;padding:6px 13px;font-size:15px}
.a-end button[aria-pressed=true]{background:var(--mint);color:#16211c;border-color:var(--mint)}
.a-end small{display:block;margin-top:10px;font-size:13.5px;opacity:.85}

@media (max-width:640px){
  .a-head{gap:6px 10px}
  .a-head-title{flex:1 1 0;min-width:0;max-width:none}
  .a-head-count{display:none}
  .a-head-ways{order:3;flex:1 1 100%}
  .a-ways{grid-template-columns:minmax(0,1fr)}
  .a-item{grid-template-columns:minmax(0,1fr)}
  .a-choice{justify-content:flex-start;max-width:none}
}
@media (prefers-reduced-motion:reduce){.a-toast{transition:none}}
@media print{.a-head,.a-toast,.a-band{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<header class="a-head" id="head">
  <span class="a-head-title" id="head-title"></span>
  <nav class="a-head-ways" id="head-ways" aria-label="Ways"></nav>
  <div class="a-head-right"><span class="a-head-count" id="head-count"></span><button type="button" class="a-head-copy" id="head-copy">Copy answers</button></div>
</header>
<p class="a-band" id="band" hidden></p>
<main id="stage"></main>
<div class="a-toast" id="toast" role="status" aria-live="polite"></div>
<script type="application/json" id="content">/*@CONTENT@*/</script>
<script>window.A = JSON.parse(document.getElementById("content").textContent);</script>
<!--@SCRIPTS@-->
</body>
</html>
