<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Café spring plan</title>
<style>
:root{--desk:#31505A;--desk2:#1F363F;--win:#262B2E;--mint:#5ECFA0;--amber:#E8B25C;--ink:#ECEFED;--dim:#A4AEAC;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;min-height:100dvh;background:linear-gradient(155deg,var(--desk),var(--desk2)) fixed;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}

.a-head{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px clamp(12px,2.5vw,24px);background:#14181A;border-bottom:1px solid var(--line)}
.a-head-title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32ch}
.a-head-ways{display:flex;gap:4px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.a-head-ways::-webkit-scrollbar{display:none}
.a-head-ways button{flex:none;height:32px;padding:0 12px;border:0;border-radius:7px;background:none;color:rgba(255,255,255,.66);font-weight:600;font-size:14px}
.a-head-ways button:hover{background:rgba(255,255,255,.07);color:#fff}
.a-head-ways button[aria-current=page]{background:rgba(255,255,255,.14);color:#fff}
.a-head-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.a-head-count{font-size:13px;color:rgba(255,255,255,.62);white-space:nowrap}
.a-head-copy{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);border-radius:7px;padding:5px 12px;font-size:14px;white-space:nowrap}
.a-head-copy:hover{background:rgba(255,255,255,.15)}
.a-band{margin:0;padding:8px clamp(16px,2.5vw,24px);background:#1A2023;color:#DDE3E0;font-size:14px;line-height:1.4;border-bottom:1px solid var(--line)}
.a-error{padding:40px 20px;max-width:640px;margin:0 auto}
.a-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#14181A;color:#fff;font-size:14px;padding:9px 16px;border-radius:9px;box-shadow:0 8px 28px rgba(0,0,0,.5);z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}
.a-toast.on{opacity:1}

.a-start{max-width:760px;margin:0 auto;padding:clamp(28px,6vh,64px) clamp(16px,4vw,40px) 80px}
.a-start h1{font-size:clamp(30px,4.2vw,44px);line-height:1.12;margin:0 0 14px;font-weight:700;letter-spacing:-.015em}
.a-start h2{font-size:21px;margin:40px 0 10px}
.a-start p{margin:0 0 12px}
.a-lead{font-size:18px;line-height:1.5;color:#DDE3E0}
.a-ways{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:22px 0 0}
.a-way{display:flex;flex-direction:column;gap:2px;text-align:left;padding:14px 16px;border:1px solid rgba(255,255,255,.16);border-radius:10px;background:rgba(0,0,0,.18)}
.a-way:hover{background:rgba(0,0,0,.3);border-color:rgba(255,255,255,.3)}
.a-way-title{font-weight:700;font-size:17px}
.a-way-when{font-size:13.5px;color:var(--amber)}
.a-way-does{font-size:14.5px;color:#C9D2CF;line-height:1.4;margin-top:4px}
.a-items{list-style:none;margin:0;padding:0}
.a-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 18px;align-items:start;padding:14px 0;border-top:1px solid rgba(255,255,255,.14)}
.a-item:last-child{border-bottom:1px solid rgba(255,255,255,.14)}
.a-item h3{margin:0 0 4px;font-size:17px;display:flex;gap:10px;align-items:baseline}
.a-nr{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:50%;background:var(--amber);color:#1a1a1a;font-size:13px;font-weight:700}
.a-item p{margin:0 0 6px;font-size:15.5px;color:#D5DDD9}
.a-item details{font-size:15px;color:#C9D2CF}
.a-item summary{cursor:pointer;color:var(--mint);font-size:14.5px}
.a-item details p{margin:6px 0 0}
.a-choice{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:290px}
.a-choice button{border:1px solid rgba(255,255,255,.3);background:none;border-radius:7px;padding:6px 13px;font-size:15px}
.a-choice button:hover{background:rgba(255,255,255,.08)}
.a-choice button[aria-pressed=true]{background:var(--mint);color:#16211c;border-color:var(--mint)}
.a-committed{margin-top:22px;border-top:1px solid rgba(255,255,255,.14);padding-top:12px}
.a-committed summary{cursor:pointer;font-weight:600}
.a-start-end{margin-top:30px;padding:18px 20px;border-radius:12px;background:rgba(0,0,0,.22)}
.a-small{font-size:14px;color:#B9C3C0;margin-top:26px}

.a-end{font-size:16px;line-height:1.45}
.a-end pre{white-space:pre-wrap;background:rgba(0,0,0,.28);color:#fff;padding:12px 14px;border-radius:8px;font:14.5px/1.5 ui-monospace,Menlo,monospace;margin:10px 0}
.a-end-buttons{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.a-end-rating{margin-top:14px}
.a-end button{border:1px solid currentColor;background:transparent;border-radius:7px;padding:6px 13px;font-size:15px}
.a-end button[aria-pressed=true]{background:var(--mint);color:#16211c;border-color:var(--mint)}
.a-end small{display:block;margin-top:10px;font-size:13.5px;opacity:.85}

@media (max-width:640px){
  .a-head{gap:6px 10px}
  .a-head-title{flex:1 1 0;min-width:0;max-width:none}
  .a-head-count{display:none}
  .a-head-ways{order:3;flex:1 1 100%}
  .a-ways{grid-template-columns:minmax(0,1fr)}
  .a-item{grid-template-columns:minmax(0,1fr)}
  .a-choice{justify-content:flex-start;max-width:none}
}
@media (prefers-reduced-motion:reduce){.a-toast{transition:none}}
@media print{.a-head,.a-toast,.a-band{display:none!important}body{background:#fff;color:#000}}
</style>
</head>

<script>/* base.js */
/* Basics all ways share: numbers, possible answers, the unit, the four ways.
   window.A is the content from content.json, checked and inserted by build.py. */
(function () {
  const A = window.A;
  const CHARS = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  A.esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) => CHARS[c]);

  A.items.forEach((p, i) => { p.nr = i + 1; });
  A.item = (id) => A.items.find((p) => p.id === id) || null;

  const STANDARD = [["yes", "Yes"], ["no", "No"], ["later", "Later"]];
  const WORD = { yes: "yes", no: "no", later: "later" };
  /* Possible answers of an item as [value, button text]. Choice questions have their own options and always "Later". */
  A.answers = (p) => (p.options ? p.options.map((o) => [o.id, o.text]).concat([["later", "Later"]]) : STANDARD);
  A.isChoice = (p) => !!p.options;
  /* How an answer reads in the text for the chat. */
  A.word = (p, w) => {
    if (Object.prototype.hasOwnProperty.call(WORD, w)) return WORD[w];
    const o = (p.options || []).find((x) => x.id === w);
    return o ? o.text : String(w);
  };
  A.label = (p, w) => (A.answers(p).find(([x]) => x === w) || [w, A.word(p, w)])[1];

  /* Unit of the cost, for example build night. Without it there are no amounts. */
  const U = A.unit || null;
  A.cost = (n) => n + " " + (n === 1 ? U.one : U.many);
  A.hasCost = (p) => !p.options && Number.isInteger(p.cost) && p.cost > 0;

  A.WAYS = [
    { id: "paper", title: "Tomorrow's Paper", when: "Over coffee", does: "Newspapers from the future, each with a different pick. You take the future you want to read, then change single items." },
    { id: "budget", title: "Build Budget", when: "To play", does: "You set a budget and put on the build plan what it is worth to you. Then reality rolls the dice." },
    { id: "panels", title: "Four Panels", when: "To look at", does: "Each item as a small picture story. Three pictures tell it, the fourth shows the real thing." },
    { id: "car", title: "In the Car", when: "On the road", does: "To listen to, one piece per item. Only listen while driving, answer after you have parked." },
  ];
  A.wayName = (id) => (A.WAYS.find((w) => w.id === id) || {}).title || null;
  A.build = {};
})();
</script>

    d = JSON.parse(localStorage.getItem(KEY)) || {};

  d.version = d.version || {}; // item id -> version of the question the answer was given to
  d.order = d.order || []; // item ids, built first comes first
  d.ways = d.ways || {}; // way id -> "pleasant" | "okay" | "annoying"

  /* Whatever the stored state has that no longer fits the content is dropped: an answer to a question that has

  A.items.forEach((p) => {

    if (w && (d.version[p.id] !== p.version || !A.answers(p).some(([x]) => x === w))) delete d.answers[p.id];

    try {
      localStorage.setItem(KEY, JSON.stringify(d));
    } catch (e) {
      /* private window: the state only lasts until it is closed */
    }
    /* A listener of a way left long ago must not drag the others down with it. */
    listeners.forEach((f) => {
      try {
        f();
      } catch (e) {

      }
    });

    rateWay(w, rating) {

    on(f) {
      listeners.add(f);
      return () => listeners.delete(f);

    text() {

      const ways = Object.entries(d.ways).filter(([w]) => A.ways.includes(w) && A.wayName(w));

        a.style.opacity = "0";

        try {
          ok = document.execCommand("copy");
        } catch (e2) {
          ok = false;
        }
        a.remove();
        return ok;
      }
    },
  };
})();

          + "<p>No new " + esc(A.unit.one) + " is added. What is already promised comes anyway:</p>"
          + "<table>" + committed.map((z) => row(esc(z.name), z.cost ? A.cost(z.cost) : "")).join("") + (committedSum ? totalRow("Together", committedSum) : "") + "</table></section>";
      }
      return '<section class="paper-cost"><h2>What it costs</h2>'
        + "<table>" + withCost.map((p) => row("<b>" + esc(p.short) + ".</b> " + esc(p.title), A.cost(p.cost))).join("") + totalRow("Together", sum(a.yes)) + "</table>"
        + (A.unit.explain ? "<p>" + esc(A.unit.explain) + "</p>" : "")
        + (committedSum ? "<p>Every edition also carries what is already promised: " + esc(A.cost(committedSum)) + ", also estimated.</p>" : "") + "</section>";
    }

    function letterHtml(a) {
      const para = (short, text) => (text ? "<p><b>" + esc(short) + ".</b> " + esc(text) + "</p>" : "");
      /* "Nothing New" has nothing new. What speaks against it there is what stays annoying today. */
      if (!a.yes.length) return A.items.filter((p) => p.proposal === "yes").map((p) => para(p.short, p.familiar || p.why)).join("");
      const i = EDITIONS.indexOf(a);
      const before = i > 0 ? EDITIONS[i - 1] : null;
      /* When the editions build on each other, the letter only covers what is new, and the old still holds. */
      const nested = before && before.yes.length && before.yes.every((id) => a.yes.includes(id));
      const fresh = a.yes.filter((id) => !nested || !before.yes.includes(id)).map(A.item);
      /* The letter speaks against the item. p.counter speaks against the proposal and only fits when the proposal is yes;
         risk and regret always speak against the item. */
      const against = (p) => [(p.proposal === "yes" ? p.counter : ""), p.regret || p.risk || ""].filter(Boolean).join(" ");
      const own = fresh.map((p) => para(p.short, against(p))).join("");
      if (!nested) return own;
      return "<div>" + own + '</div><div><p class="paper-postscript">From the edition “' + esc(before.name) + "” this still holds:</p>"
        + before.yes.map(A.item).map((p) => para(p.short, against(p))).join("") + "</div>";
    }

    function beforeHtml(a) {
      const withConflict = a.yes.map(A.item).filter((p) => p.conflict);
      if (!withConflict.length) return "";
      return '<section class="paper-before"><h2>You already said otherwise</h2>'
        + withConflict.map((p) => "<p><b>" + esc(p.short) + ".</b> " + esc(p.conflict) + "</p>").join("") + "</section>";
    }

    function showEdition(a) {
      root.replaceChildren();
      const letter = letterHtml(a);
      const caption = a.caption || "This is how it could look in this edition.";
      const page = part("div", "paper-read",
        '<div class="paper-bar"><button type="button" class="paper-back">Back to the kiosk</button></div>'
        + '<article class="paper-spread paper-texture">' + masthead(a) + BAND
        + '<h1 class="paper-headline" tabindex="-1">' + esc(a.headline) + "</h1>"
        + '<p class="paper-lede">' + esc(a.lede) + "</p>"
        + '<div class="paper-cols' + (a.image ? "" : " paper-no-image") + '"><div><p class="paper-story"><b>' + esc(Z.place) + ".</b> " + esc(a.story) + "</p>" + costHtml(a) + "</div>"
        + (a.image ? '<figure class="paper-image"><img alt="' + esc(caption) + '" src="' + esc(a.image) + '"><figcaption>' + esc(caption) + "</figcaption></figure>" : "") + "</div>"
        + (letter ? '<section class="paper-letter"><h2>Letter to the editor: why it could go wrong</h2><div class="paper-letter-text">' + letter + "</div>"
          + '<p class="paper-letter-note">No real reader wrote this. The sentences come straight from the list of items.</p></section>' : "")
        + beforeHtml(a)
        + '<div class="paper-act"><button type="button" class="paper-take">Take this edition</button><button type="button" class="paper-back">Back to the kiosk</button>'
        + '<p class="paper-act-note">This fills in all ' + A.items.length + " items and replaces what you already answered there. Afterwards you can change each one.</p></div>"
        + "</article>");
      const spread = page.querySelector(".paper-spread");
      page.querySelectorAll(".paper-back").forEach((b) => (b.onclick = () => transition(spread, () => showKiosk(a))));
      page.querySelector(".paper-take").onclick = () => {
        A.items.forEach((p) => State.set(p.id, target(a, p)));
        /* An edition says nothing about the order. An old order from the build budget would no longer fit the new pick. */
        State.setOrder([]);
        transition(spread, () => showList(a));
      };
      root.append(page);
      toTop();
      page.querySelector("h1").focus({ preventScroll: true });
      return spread;
    }

    function showList(a) {
      root.replaceChildren();
      const row = (p) => '<li class="paper-row"><div><h2 id="paper-n-' + esc(p.id) + '">' + esc(p.short) + "</h2><p>" + esc(p.about) + "</p></div>"
        + '<div class="paper-choice" role="radiogroup" aria-labelledby="paper-n-' + esc(p.id) + '">'
        + A.answers(p).map(([w, l]) => '<label><input type="radio" name="paper-' + esc(p.id) + '" value="' + esc(w) + '"' + (State.value(p.id) === w ? " checked" : "") + "><span>" + esc(l) + "</span></label>").join("")
        + "</div></li>";
      const explain = a
        ? "You took the edition “" + esc(a.name) + "”. What is in the edition is yes. What is not in it and where my proposal was no is no. Everything else is later."
          + (Object.keys(a.choices).length ? " For the choice questions, the edition's pick is set." : "") + " You can change every row here."
        : "Here you answer every item yourself, without taking an edition.";
      const page = part("div", "paper-results",
        '<div class="paper-bar" style="max-width:880px"><button type="button" class="paper-back">Back to the kiosk</button></div>'
        + '<section class="paper-result paper-texture">'
        + '<h1 class="paper-title" tabindex="-1">' + (a ? "What you have marked with it" : "All " + A.items.length + " items one by one") + "</h1>"
        + '<p class="paper-explain">' + explain + "</p>"
        + '<ul class="paper-items">' + A.items.map(row).join("") + "</ul>"
        + '<p class="paper-sum" aria-live="polite"></p></section>'
        + '<section class="paper-end"><div></div></section>');
      const sumEl = page.querySelector(".paper-sum");
      const end = page.querySelector(".paper-end div");
      const drawSum = () => {
        const yes = A.items.filter((p) => State.value(p.id) === "yes").map((p) => p.id);
        if (WITH_COST) {
          sumEl.textContent = (yes.length && sum(yes) ? "What is on yes costs " + A.cost(sum(yes)) + " together, estimated." : "Nothing with a cost is on yes, so no new " + A.unit.many + " are added.")
            + (committedSum ? " On top comes what is already promised: " + A.cost(committedSum) + ", also estimated." : "");
        } else {
          sumEl.textContent = State.count() + " of " + A.items.length + " items answered.";
        }
      };
      drawSum();
      page.addEventListener("change", (e) => {
        State.set(e.target.name.slice("paper-".length), e.target.value);
        drawSum();
      });
      const sheet = page.querySelector(".paper-result");
      page.querySelector(".paper-back").onclick = () => {
        showKiosk(a);
        if (!a) root.querySelector(".paper-single").focus();
      };
      root.append(page);
      A.end(end, "paper");
      toTop();
      page.querySelector("h1").focus({ preventScroll: true });
      return sheet;
    }

    showKiosk(null);
  };
})();
</script>

.budget-result .budget-big{font-size:clamp(50px,6.4vw,72px)}
.budget-rows{list-style:none;margin:12px 0 0;padding:0;border-top:2.5px solid var(--ink)}
.budget-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:10px 0;border-bottom:1px solid rgba(38,33,26,.4)}
.budget-rnr{font:800 25px/1 ${STENCIL}}
.budget-rname{font-weight:700;line-height:1.3}
.budget-rname small{display:block;font-size:15.5px;font-weight:400;color:var(--soft)}
.budget-rcost{text-align:right;font-weight:600;white-space:nowrap}
.budget-rcost small{display:block;font-size:14px;font-weight:400;color:var(--soft)}
.budget-total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:12px 0 0;font:800 31px/1.1 ${STENCIL}}
.budget-left-out{margin:10px 0 0}
.budget-sentence{margin:16px 0 0;font-weight:600;font-size:19px;line-height:1.4}
.budget-confirm{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:16px}
.budget-confirm .budget-main{width:auto;margin:0;padding:12px 22px 11px}
.budget-confirm .budget-small{flex:1 1 280px;margin:0}
.budget-end-area{margin-top:26px;max-width:700px;display:flex;flex-wrap:wrap;gap:16px 26px;align-items:flex-start;padding:20px 22px;background:var(--dark) ${DARK};color:var(--chalk);border:2.5px solid var(--ink);border-radius:3px}
.budget-end-area :focus-visible{outline-color:var(--chalk)}
.budget-end-rest{flex:1 1 360px;min-width:0}
.budget-end-area .budget-btn:hover{background:var(--chalk);color:var(--dark);border-color:var(--chalk)}

@media (max-width:1279px){
  .budget{padding-bottom:104px}
  .budget-cols{grid-template-columns:minmax(0,1fr)}
  .budget-side{position:static;max-height:none;overflow:visible;padding:0;margin:0}
  .budget-plan,.budget-plan[data-dense]{--unit:52px;--row:40px}
  .budget-controls button{width:40px}
  .budget-dock{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;align-items:center;justify-content:space-between;gap:12px;padding:9px 16px;padding-bottom:max(9px,env(safe-area-inset-bottom));background:var(--dark);color:var(--chalk);font-weight:600;font-size:16px}
  .budget-dock :focus-visible{outline-color:var(--chalk)}
  .budget-dock .budget-btn{padding:6px 12px;white-space:nowrap}
  .budget-dock .budget-btn:hover{background:var(--chalk);color:var(--dark);border-color:var(--chalk)}
}
@media (max-width:520px){
  .budget-slider-row{gap:14px}
  .budget-number{flex-direction:column;align-items:center;gap:0;font-size:14px}
  .budget-number b{font-size:52px}
  .budget-scale{font-size:14px}
  .budget-place{width:100%;margin-left:0}
  .budget-bench{padding:18px 14px 14px}
  .budget-roll{gap:10px;padding-right:4px}
}
@media (prefers-reduced-motion:reduce){
  .budget-block[data-new],.budget-block[data-grew]{animation:none}
  .budget-face::after{transition:none}
}
`;

  const PIPS = {
    1: [[50, 50]],
    2: [[27, 27], [73, 73]],
    3: [[27, 27], [50, 50], [73, 73]],
    4: [[27, 27], [73, 27], [27, 73], [73, 73]],
    5: [[27, 27], [73, 27], [50, 50], [27, 73], [73, 73]],
    6: [[27, 25], [73, 25], [27, 50], [73, 50], [27, 75], [73, 75]],
  };
  // rotateX, rotateY that bring each face up (towards the camera). Opposite faces add up to 7.
  const POSE = { 1: [0, 0], 2: [-90, 0], 3: [0, -90], 4: [0, 90], 5: [90, 0], 6: [0, 180] };
  const TILT = 36;

  const ICON = {
    up: '<path d="M3 10.5 8 5.2l5 5.3" fill="none" stroke="currentColor" stroke-width="2.2"/>',
    down: '<path d="M3 5.5 8 10.8l5-5.3" fill="none" stroke="currentColor" stroke-width="2.2"/>',
    remove: '<path d="M3.6 3.6l8.8 8.8M12.4 3.6l-8.8 8.8" fill="none" stroke="currentColor" stroke-width="2.2"/>',
  };

  /* For and against, without giving the proposal away: why always speaks for the item, risk and regret always against.
     counter speaks against the proposal and only fits where its direction is clear. */
  function weigh(p) {
    const pro = p.why || (p.proposal === "no" ? p.counter : "");
    const con = p.risk || p.regret || (p.proposal === "yes" ? p.counter : "");
    if (!pro && !con) return "";
    return '<details class="budget-proscons"><summary>For and against</summary>'
      + (pro ? "<p>For: " + esc(pro) + "</p>" : "")
      + (con ? "<p>Against: " + esc(con) + "</p>" : "") + "</details>";
  }

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const units = (n, limit) => '<span class="budget-units" aria-hidden="true">'
    + Array.from({ length: n }, (_, i) => (i >= limit ? '<i class="budget-over"></i>' : "<i></i>")).join("") + "</span>";

  function dieHtml() {
    const face = (n) => '<div class="budget-face" data-s="' + n + '"><svg viewBox="0 0 100 100" aria-hidden="true">'
      + PIPS[n].map(([x, y]) => '<circle cx="' + x + '" cy="' + y + '" r="9.5"/>').join("") + "</svg></div>";
    return '<div class="budget-shadow"></div><div class="budget-scene"><div class="budget-lift"><div class="budget-body">'
      + [1, 2, 3, 4, 5, 6].map(face).join("") + "</div></div></div>";
  }

  /* The die falls, bounces twice and settles. Without motion it is there at once. */
  function throwDie(spot, pips) {
    spot.insertAdjacentHTML("beforeend", dieHtml());
    const body = spot.querySelector(".budget-body");
    const lift = spot.querySelector(".budget-lift");
    const shadow = spot.querySelector(".budget-shadow");
    const scene = spot.querySelector(".budget-scene");
    const [x, y] = POSE[pips];
    const spin = (Math.random() < 0.5 ? -1 : 1) * (15 + Math.random() * 13);
    const pose = (z, ax, ay) => "rotateX(" + TILT + "deg) rotateZ(" + z + "deg) rotateX(" + ax + "deg) rotateY(" + ay + "deg)";
    body.style.transform = pose(spin, x, y);
    const settled = () => body.querySelector('[data-s="' + pips + '"]').classList.add("budget-up");
    if (calm()) {
      settled();
      return Promise.resolve();
    }
    const fall = "cubic-bezier(.55,0,.85,.45)", rise = "cubic-bezier(.15,.55,.45,1)";
    // Fade in on the scene: opacity on .budget-lift would flatten the 3D die.
    scene.animate({ opacity: [0, 1] }, ROLL_MS * 0.2);
    lift.animate([
      { transform: "translateY(-170px)", easing: fall },
      { transform: "translateY(0)", offset: 0.52, easing: rise },
      { transform: "translateY(-18px)", offset: 0.68, easing: fall },
      { transform: "translateY(0)", offset: 0.82, easing: rise },
      { transform: "translateY(-4px)", offset: 0.9, easing: fall },
      { transform: "translateY(0)" },
    ], ROLL_MS);
    shadow.animate([
      { transform: "scale(.5)", opacity: 0 },
      { transform: "scale(1)", opacity: 1, offset: 0.52 },
      { transform: "scale(.88)", opacity: 0.75, offset: 0.68 },
      { transform: "scale(1)", opacity: 1, offset: 0.82 },
      { transform: "scale(1)", opacity: 1 },
    ], ROLL_MS);
    return body.animate(
      [{ transform: pose(spin + 130, x + 540, y - 360) }, { transform: pose(spin, x, y) }],
      { duration: ROLL_MS, easing: "cubic-bezier(.2,.72,.3,1)" },
    ).finished.then(settled);
  }

  A.build.budget = function (el) {
    const B = A.budget || {};
    const U = A.unit;
    const MIN = B.min, MAX = B.max, START = B.start; // set and checked by build.py
    const cost = A.cost;
    const number = (n) => "<b>" + n + "</b>" + esc(n === 1 ? U.one : U.many);
    const cards = A.items.filter((p) => A.hasCost(p) && p.cost <= MAX);
    const tooBig = A.items.filter((p) => A.hasCost(p) && p.cost > MAX);
    const without = A.items.filter((p) => !A.hasCost(p));
    const item = A.item;

    el.innerHTML = "<style>" + CSS + '</style><div class="budget"><div class="budget-say" aria-live="polite"></div><div class="budget-area"></div></div>';
    const root = el.querySelector(".budget");
    const area = el.querySelector(".budget-area");
    const say = (t) => { el.querySelector(".budget-say").textContent = t; };

    let s, dragged = null;
    const length = (id) => item(id).cost + (s.plus[id] || 0);
    const used = () => s.plan.reduce((n, id) => n + length(id), 0);

    function toTop(target) {
      root.scrollIntoView();
      if (target) target.focus({ preventScroll: true });
    }

    /* Cards */
    function cardHtml(p) {
      const oversize = p.cost > MAX;
      return '<article class="budget-card' + (oversize ? ' budget-oversize"' : '" data-id="' + esc(p.id) + '"') + ">"
        + '<div class="budget-card-head"><span class="budget-name">' + esc(p.short) + '</span><span class="budget-size">'
        + (oversize ? "" : units(p.cost, Infinity)) + "estimated " + esc(cost(p.cost)) + "</span></div>"
        + (oversize ? units(p.cost, START) : "")
        + '<h3 class="budget-title">' + esc(p.title) + "</h3>"
        + (p.familiar ? '<p class="budget-familiar">' + esc(p.familiar) + "</p>" : "")
        + '<p class="budget-about">' + esc(p.about) + "</p>"
        + (oversize ? '<p class="budget-neverfits">Fits no round here, not even with all ' + esc(cost(MAX)) + ". When you mark a plan, this card stays as it is.</p>" : "")
        + '<div class="budget-foot">' + weigh(p)
        + (oversize ? "" : '<button type="button" class="budget-btn budget-place" data-a="place"></button>')
        + "</div></article>";
    }

    function updateCards() {
      const free = s.budget - used();
      area.querySelectorAll(".budget-card[data-id]").forEach((k) => {
        const p = item(k.dataset.id), placed = s.plan.includes(p.id), fits = p.cost <= free;
        k.classList.toggle("budget-placed", placed);
        k.classList.toggle("budget-nofit", !placed && !fits);
        const b = k.querySelector(".budget-place");
        b.textContent = placed ? "Take off the build plan" : fits ? "Put on the build plan" : "No longer fits, take something out first.";
        b.setAttribute("aria-label", p.short + ": " + b.textContent);
        if (!placed && !fits) b.setAttribute("aria-disabled", "true");
        else b.removeAttribute("aria-disabled");
      });
      area.querySelectorAll(".budget-oversize").forEach((k, i) => {
        const bar = k.querySelector(".budget-units");
        if (bar) bar.outerHTML = units(tooBig[i].cost, s.budget);
      });
    }

    /* Build plan */
    function blockHtml(id, fresh) {
      const p = item(id), n = length(id), i = s.plan.indexOf(id);
      const live = s.phase === "plan" || s.phase === "clear";
      const button = (a, label, icon, off) => '<button type="button" data-a="' + a + '" aria-label="' + esc(label) + '" title="' + esc(label) + '"'
        + (off ? ' aria-disabled="true"' : "") + '><svg viewBox="0 0 16 16" aria-hidden="true">' + ICON[icon] + "</svg></button>";
      return '<li class="budget-block" data-id="' + esc(id) + '" style="--n:' + n + '"' + (n > 1 ? " data-tall" : "") + (live ? ' draggable="true"' : "")
        + (fresh === id ? (s.phase === "plan" ? " data-new" : " data-grew") : "") + ">"
        /* With one unit the height shows the amount; without the label the name has room. */
        + '<span class="budget-bname">' + esc(p.short) + "</span>" + (n > 1 ? '<span class="budget-bcost">' + esc(cost(n)) + "</span>" : '<span class="budget-say">' + esc(cost(n)) + "</span>")
        + (live ? '<span class="budget-controls">'
          + button("up", p.short + " up", "up", i === 0)
          + button("down", p.short + " down", "down", i === s.plan.length - 1)
          + (s.phase === "plan" ? button("drop", p.short + " off the build plan", "remove") : button("takeout", "Take " + p.short + " out", "remove"))
          + "</span>" : "")
        + (s.plus[id] ? '<span class="budget-more">' + esc(cost(1)) + " longer, rolled</span>" : "")
        + "</li>";
    }

    function footHtml() {
      const rest = s.budget - used();
      if (s.phase === "plan") {
        const note = !s.plan.length ? "Put at least one card on the build plan first."
          : rest < 0 ? "The build plan is " + cost(-rest) + " too long. Take something out or give the round more."
            : "Every card of " + cost(2) + " or more gets a roll. On a 5 or 6 it takes " + cost(1) + " longer. You only roll once. Afterwards you can still take things out and reorder, but not add anything.";
        return '<button type="button" class="budget-main" data-a="roll"' + (!s.plan.length || rest < 0 ? " disabled" : "") + ">Roll for reality</button>"
          + '<p class="budget-small">' + esc(note) + "</p>";
      }
      if (s.phase !== "clear") return "";
      const outside = s.removed.length ? '<div class="budget-removed">Taken out<ul>' + s.removed.map((r) => '<li data-id="' + esc(r.id) + '"><span>' + esc(item(r.id).short) + ", " + esc(cost(length(r.id)))
        + '</span><button type="button" class="budget-btn" data-a="putback">Put back in</button></li>').join("") + "</ul></div>" : "";
      if (rest < 0) {
        return '<p class="budget-verdict budget-verdict-over" tabindex="-1">' + esc(cost(-rest)) + " too much. Take something out with the cross on the block until it fits again. You cannot roll again.</p>" + outside;
      }
      return '<p class="budget-verdict" tabindex="-1">' + (rest === 0 ? "It fits exactly, nothing is left." : "It fits. " + esc(cost(rest)) + " left.") + "</p>"
        + '<button type="button" class="budget-main" data-a="next">Next: how it would be built</button>' + outside;
    }

    function drawSide(fresh) {
      const side = area.querySelector(".budget-side");
      if (!side) return;
      const a = document.activeElement;
      const keep = a && a.dataset && a.dataset.a && side.contains(a)
        ? (a.closest("[data-id]") ? '[data-id="' + a.closest("[data-id]").dataset.id + '"] ' : "") + '[data-a="' + a.dataset.a + '"]' : null;
      const b = used(), rest = s.budget - b, rows = Math.max(s.budget, b);
      const over = rest < 0;
      side.innerHTML = '<div class="budget-plan-head"><h2 class="budget-h2" tabindex="-1">Build plan</h2>'
        + '<p class="budget-status"><span><b>' + b + "</b> used</span>"
        + (over ? '<span class="budget-over-by"><b>' + -rest + "</b> too much</span>" : "<span><b>" + rest + "</b> free</span>") + "</p></div>"
        + '<p class="budget-small">The top gets built first. Budget: ' + esc(cost(s.budget)) + "."
        + (s.phase === "rolling" ? "" : " Move things with the buttons, the arrow keys or the mouse.") + "</p>"
        + '<div class="budget-plan"' + (rows > 10 ? " data-dense" : "") + ' style="--budget:' + s.budget + ";--rows:" + rows + '">'
        + '<div class="budget-ruler" aria-hidden="true">'
        + Array.from({ length: s.budget }, (_, i) => "<span>" + (i + 1) + "</span>").join("")
        + (over ? '<span class="budget-overflow" style="height:calc(' + -rest + ' * var(--unit))"></span>' : "") + "</div>"
        + '<div class="budget-field"><div class="budget-slots" aria-hidden="true"></div>'
        + (s.plan.length ? '<ol class="budget-blocks">' + s.plan.map((id) => blockHtml(id, fresh)).join("") + "</ol>"
          : '<p class="budget-empty">Still empty. Pick a card, it lands here.</p>')
        + (over ? '<div class="budget-cut" aria-hidden="true" style="top:calc(' + s.budget + ' * var(--unit))"></div>' : "")
        + "</div></div>" + footHtml();
      if (keep) { const target = side.querySelector(keep); if (target) target.focus(); }
    }

    function update(fresh) {
      updateCards();
      drawSide(fresh);
      const dock = area.querySelector(".budget-dock span");
      if (dock) {
        const rest = s.budget - used();
        dock.textContent = used() + " of " + cost(s.budget) + (rest < 0 ? ", " + -rest + " too much" : ", " + rest + " free");
      }
    }

    function showPlan() {
      const z = A.committed || [], committedSum = z.reduce((n, x) => n + (x.cost || 0), 0);
      area.innerHTML = '<h1 class="budget-big" tabindex="-1">' + esc(B.title || "Build Budget") + "</h1>"
        + '<p class="budget-intro">' + esc(B.intro ? B.intro + " " : "") + cards.length + " items are up for grabs, and the budget is not enough for all of them. You give this round a budget and put on the build plan what it is worth to you.</p>"
        + '<p class="budget-intro">' + esc(U.explain ? U.explain + " " : "") + "All amounts here are estimates.</p>"
        + '<section class="budget-slider"><label class="budget-question" for="budget-input">How many ' + esc(U.many) + " do you give this round?</label>"
        + '<div class="budget-slider-row"><div class="budget-track"><input id="budget-input" data-a="budget" type="range" min="' + MIN + '" max="' + MAX + '" step="1" value="' + s.budget + '" aria-valuetext="' + esc(cost(s.budget)) + '">'
        + '<div class="budget-scale" aria-hidden="true">' + Array.from({ length: MAX - MIN + 1 }, (_, i) => "<span>" + (MIN + i) + "</span>").join("") + "</div></div>"
        + '<output class="budget-number" for="budget-input">' + number(s.budget) + "</output></div>"
        + (z.length ? '<p class="budget-committed">What is already promised comes on top and is not subtracted: ' + esc(z.map((x) => x.name).join(", ")) + "." + (committedSum ? " Together an estimated " + esc(cost(committedSum)) + "." : "") + "</p>" : "") + "</section>"
        + '<div class="budget-cols"><section><h2 class="budget-h2">Up for grabs</h2>'
        + '<p class="budget-pick">Read the card and put it on the build plan if it is worth the cost to you. A second click takes it off again.</p>'
        + '<div class="budget-cards">' + cards.map(cardHtml).join("") + tooBig.map(cardHtml).join("") + "</div>"
        + (without.length ? '<p class="budget-without">Not in the game, because there is no cost or it is a choice: ' + esc(without.map((p) => p.short).join(", ")) + ". Answer those in the overview or in another way.</p>" : "")
        + '</section><aside class="budget-side" aria-label="Build plan"></aside></div>'
        + '<div class="budget-dock"><span></span><button type="button" class="budget-btn" data-a="toplan">To the build plan</button></div>';
      update();
    }

    /* Dice round */
    function showRolling() {
      const due = s.plan.filter((id) => item(id).cost >= 2);
      const small = s.plan.filter((id) => item(id).cost < 2).map((id) => item(id).short);
      area.innerHTML = '<div class="budget-cols"><section class="budget-bench">'
        + '<h2 class="budget-bench-title" tabindex="-1">Roll for reality</h2>'
        + '<p class="budget-reason">Effort is almost always underestimated. In one study, 68&nbsp;% of projects were finished later than expected. <span class="budget-source">(Buehler et al., 1994)</span></p>'
        + '<p class="budget-rule">Every card of ' + esc(cost(2)) + " or more gets exactly one roll. On a 5 or 6 it takes " + esc(cost(1)) + " longer, otherwise it stays.</p>"
        + (due.length ? '<ol class="budget-rolls">' + due.map((id) => '<li class="budget-roll" data-id="' + esc(id) + '"><div class="budget-spot"></div><div>'
          + '<div class="budget-roll-name">' + esc(item(id).short) + '</div><div class="budget-roll-size">estimated ' + esc(cost(item(id).cost)) + "</div>"
          + '<p class="budget-roll-text">Waiting for the roll.</p></div></li>').join("") + "</ol>"
          : '<p class="budget-rule">All cards on your build plan are only ' + esc(cost(1)) + ". So there is no roll.</p>")
        + (due.length && small.length ? '<p class="budget-rule">No roll, because only ' + esc(cost(1)) + ": " + esc(small.join(", ")) + ".</p>" : "")
        + '</section><aside class="budget-side" aria-label="Build plan"></aside></div>';
      drawSide();
      toTop(area.querySelector(".budget-bench-title"));
      round(due);
    }

    async function round(due) {
      if (due.length) await wait(calm() ? 250 : LEAD_MS);
      for (const id of due) {
        if (!el.isConnected) return;
        const row = area.querySelector('.budget-roll[data-id="' + id + '"]');
        row.classList.add("budget-active");
        row.scrollIntoView({ block: "nearest" });
        const pips = 1 + Math.floor(Math.random() * 6);
        await throwDie(row.querySelector(".budget-spot"), pips);
        const longer = pips >= 5, p = item(id);
        if (longer) s.plus[id] = 1;
        const text = "Rolled a " + pips + ". " + (longer ? "Takes " + cost(1) + " longer, now " + cost(length(id)) + "." : "Stays at " + cost(p.cost) + ".");
        row.querySelector(".budget-roll-text").textContent = text;
        row.classList.remove("budget-active");
        row.classList.add("budget-rolled");
        row.classList.toggle("budget-longer", longer);
        say(p.short + ": " + text);
        if (longer) drawSide(id);
        await wait(calm() ? 300 : READ_MS);
      }
      if (!el.isConnected) return;
      s.phase = "clear";
      drawSide();
      const verdict = area.querySelector(".budget-verdict");
      say(verdict.textContent);
      verdict.focus();
    }

    /* Result */
    function showResult() {
      const b = used(), rest = s.budget - b;
      /* Marking keeps an existing "no" (see mark below), so the preview must say so instead of "later". */
      const out = cards.filter((p) => !s.plan.includes(p.id));
      const left = out.filter((p) => State.value(p.id) !== "no").map((p) => p.short);
      const stayNo = out.filter((p) => State.value(p.id) === "no").map((p) => p.short);
      area.innerHTML = '<section class="budget-result"><h2 class="budget-big" tabindex="-1">How it would be built</h2><ol class="budget-rows">'
        + s.plan.map((id, i) => {
          const p = item(id);
          return '<li class="budget-row"><span class="budget-rnr">' + (i + 1) + '</span><span class="budget-rname">' + esc(p.short) + "<small>" + esc(p.title) + "</small></span>"
            + '<span class="budget-rcost">' + esc(cost(length(id))) + (s.plus[id] ? "<small>" + p.cost + " estimated, " + esc(cost(1)) + " more from the roll</small>" : "") + "</span></li>";
        }).join("") + "</ol>"
        + '<p class="budget-total"><span>Total</span><span>' + b + " of " + esc(cost(s.budget)) + "</span></p>"
        + (rest ? '<p class="budget-small">' + esc(cost(rest)) + " left.</p>" : "")
        + (left.length ? '<p class="budget-left-out">Not in, so later: ' + esc(left.join(", ")) + ".</p>" : "")
        + (stayNo.length ? '<p class="budget-left-out">Not in, stays no: ' + esc(stayNo.join(", ")) + ".</p>" : "")
        + '<p class="budget-sentence">These are estimates. Something will still turn out differently.</p>'
        + '<div class="budget-confirm"><button type="button" class="budget-main" data-a="mark">Mark this build plan</button>'
        + '<p class="budget-small">The cards on the build plan then count as yes, all other cards as later, unless you already said no there.'
        + " The order goes along. Oversized cards and items outside the game stay as they are.</p></div></section>";
      toTop(area.querySelector(".budget-big"));
    }

    function takeOff(id, button) {
      const i = s.plan.indexOf(id), neighbour = s.plan[i + 1] || s.plan[i - 1];
      s.plan.splice(i, 1);
      update();
      const target = neighbour ? area.querySelector('.budget-block[data-id="' + neighbour + '"] [data-a="' + button + '"]') : area.querySelector(".budget-side .budget-h2");
      if (target) target.focus();
    }

    function move(id, by) {
      const i = s.plan.indexOf(id), j = i + by;
      if (i < 0 || j < 0 || j >= s.plan.length) return;
      s.plan.splice(i, 1);
      s.plan.splice(j, 0, id);
      drawSide();
      say(item(id).short + " is now at position " + (j + 1) + " of " + s.plan.length + ".");
    }

    const action = {
      place(id) {
        const p = item(id);
        if (s.plan.includes(id)) {
          s.plan.splice(s.plan.indexOf(id), 1);
          say(p.short + " is no longer on the build plan.");
          update();
        } else if (p.cost <= s.budget - used()) {
          s.plan.push(id);
          say(p.short + " is now on the build plan.");
          update(id);
        }
      },
      up: (id) => move(id, -1),
      down: (id) => move(id, 1),
      drop: (id) => takeOff(id, "drop"),
      takeout(id) {
        s.removed.push({ id, at: s.plan.indexOf(id) });
        takeOff(id, "takeout");
      },
      putback(id) {
        const r = s.removed.find((x) => x.id === id);
        s.removed = s.removed.filter((x) => x !== r);
        /* Back in front of the first card that came after it when the dice were rolled. The index from the moment of
           taking out is not enough: take out two from the top and put both back, and their order would flip. */
        const base = s.base || [];
        const mine = base.indexOf(id);
        const next = mine < 0 ? -1 : s.plan.findIndex((x) => base.indexOf(x) > mine);
        const at = mine < 0 ? Math.min(r.at, s.plan.length) : next < 0 ? s.plan.length : next;
        s.plan.splice(at, 0, id);
        update();
        const target = area.querySelector('.budget-block[data-id="' + id + '"] [data-a="takeout"]');
        if (target) target.focus();
      },
      toplan: () => area.querySelector(".budget-side").scrollIntoView(),
      roll() {
        if (s.phase !== "plan" || !s.plan.length || used() > s.budget) return;
        s.phase = "rolling";
        s.base = s.plan.slice();
        showRolling();
      },
      next() {
        if (s.phase !== "clear" || used() > s.budget) return;
        s.phase = "result";
        showResult();
      },
      mark(_, button) {
        s.plan.forEach((id) => State.set(id, "yes"));
        cards.filter((p) => !s.plan.includes(p.id) && State.value(p.id) !== "no").forEach((p) => State.set(p.id, "later"));
        State.setOrder(s.plan);
        const row = button.closest(".budget-confirm");
        row.innerHTML = '<p class="budget-sentence" tabindex="-1" style="margin:0">Marked, it only counts in the chat. It now shows in the other ways too.</p>';
        const endArea = document.createElement("section");
        endArea.className = "budget-end-area";
        endArea.innerHTML = '<div class="budget-end-rest"></div><button type="button" class="budget-btn" data-a="restart">Start over</button>';
        row.closest(".budget-result").after(endArea);
        A.end(endArea.querySelector(".budget-end-rest"), "budget");
        row.firstChild.focus();
      },
      restart() {
        fresh();
        /* Playing again changes nothing about what is marked until a new plan is marked. You should see that. */
        if (State.order().length) {
          area.querySelector(".budget-intro").insertAdjacentHTML("afterend",
            '<p class="budget-intro"><strong>Your last plan stays marked until you mark a new one.</strong></p>');
        }
        toTop(area.querySelector(".budget-big"));
      },
    };

    root.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-a]");
      if (!b || b.getAttribute("aria-disabled") === "true") return;
      const h = action[b.dataset.a], d = b.closest("[data-id]");
      if (h) h(d ? d.dataset.id : null, b);
    });
    root.addEventListener("input", (e) => {
      if (e.target.dataset.a !== "budget") return;
      s.budget = +e.target.value;
      e.target.setAttribute("aria-valuetext", cost(s.budget));
      area.querySelector(".budget-number").innerHTML = number(s.budget);
      update();
    });
    root.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
      const b = e.target.closest(".budget-block");
      if (!b || !b.hasAttribute("draggable")) return;
      e.preventDefault();
      move(b.dataset.id, e.key === "ArrowUp" ? -1 : 1);
    });

    /* Dragging with the mouse. The buttons and arrow keys can do the same. */
    const clearDrop = () => area.querySelectorAll("[data-drop]").forEach((x) => x.removeAttribute("data-drop"));
    root.addEventListener("dragstart", (e) => {
      const b = e.target.closest && e.target.closest(".budget-block");
      if (!b) return;
      dragged = b.dataset.id;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", dragged);
    });
    root.addEventListener("dragover", (e) => {
      const b = dragged && e.target.closest && e.target.closest(".budget-block");
      clearDrop();
      if (!b || b.dataset.id === dragged) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const r = b.getBoundingClientRect();
      b.dataset.drop = e.clientY > r.top + r.height / 2 ? "bottom" : "top";
    });
    root.addEventListener("drop", (e) => {
      const b = dragged && e.target.closest && e.target.closest(".budget-block");
      if (!b || b.dataset.id === dragged) return;
      e.preventDefault();
      const below = b.dataset.drop === "bottom";
      s.plan.splice(s.plan.indexOf(dragged), 1);
      s.plan.splice(s.plan.indexOf(b.dataset.id) + (below ? 1 : 0), 0, dragged);
      dragged = null;
      drawSide();
    });
    root.addEventListener("dragend", () => { dragged = null; clearDrop(); });

    function fresh() {
      s = { budget: START, plan: [], plus: {}, phase: "plan", removed: [] };
      showPlan();
    }
    fresh();
  };
})();
</script>
<script>/* ways/panels.js */
/* Way "Four Panels": every item as a small picture story.
   Three painted panels, the fourth shows the real thing (screenshot, excerpt, draft). Without it, the fourth
   caption stands there as text. Items without pictures appear as a text card, so nothing gets lost. */
(function () {
  const A = window.A;

  const CSS = `
@import url("https://fonts.googleapis.com/css2?family=Alegreya:wght@500;800&family=Alegreya+Sans:wght@400;500;700&display=swap");
.panel-root{container-type:inline-size;--panel-paper:#D3CBC0;--panel-sky:#FDF6ED;--panel-ink:#30251F;--panel-edge:clamp(16px,3cqi,28px);color:var(--panel-ink);font:400 18px/1.5 "Alegreya Sans","Avenir Next",-apple-system,sans-serif}
.panel-paper{background:var(--panel-paper);padding:clamp(18px,2.6cqi,26px) var(--panel-edge) clamp(56px,8cqi,88px)}
.panel-column{max-width:1040px;margin:0 auto}
.panel-paper :focus-visible{outline:3px solid var(--panel-ink);outline-offset:3px}

.panel-legend{margin:0 0 clamp(22px,3cqi,30px);max-width:44em;font:500 21px/1.34 "Alegreya",Georgia,serif;text-wrap:balance}
.panel-item + .panel-item{margin-top:clamp(72px,11cqi,120px)}
.panel-title{margin:0 0 14px;font:800 clamp(25px,3.2cqi,31px)/1.14 "Alegreya",Georgia,serif;text-wrap:balance}

.panel-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}
.panel-cell{margin:0;min-width:0}
.panel-frame{border:2px solid var(--panel-ink);background:var(--panel-sky);aspect-ratio:1200/896;overflow:hidden}
.panel-frame img{display:block;width:100%;height:100%;object-fit:cover}
.panel-real img{object-fit:contain;background:linear-gradient(155deg,#31505A,#1F363F)}
.panel-caption{margin:8px 0 0;font:500 20px/1.28 "Alegreya",Georgia,serif;text-wrap:pretty}
.panel-text-only{height:100%;display:grid;place-items:center;padding:8%;text-align:center;background:linear-gradient(155deg,#31505A,#1F363F);color:#ECEFED;font:500 clamp(21px,3.2cqi,29px)/1.24 "Alegreya",Georgia,serif;text-wrap:balance}

.panel-facts{display:grid;grid-template-columns:8.4em minmax(0,40em);gap:9px 20px;margin:26px 0 0}
.panel-facts dt{font-weight:700}
.panel-facts dd{margin:0}
.panel-facts dt:last-of-type{align-self:center}
.panel-choice{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.panel-btn{min-width:96px;min-height:44px;padding:8px 20px;border:1.5px solid var(--panel-ink);border-radius:2px;background:none;color:var(--panel-ink);font:inherit;font-weight:500}
@media (hover:hover){.panel-btn:hover{background:rgba(48,37,31,.1)}}
.panel-btn[aria-pressed=true]{background:var(--panel-ink);color:var(--panel-sky)}

.panel-textcard{border:2px solid var(--panel-ink);background:var(--panel-sky);padding:clamp(20px,3.2cqi,32px)}
.panel-textcard .panel-facts{margin-top:18px}

.panel-end{background:#1F363F;color:#ECEFED;padding:clamp(32px,6cqi,56px) var(--panel-edge) clamp(40px,7cqi,72px)}
.panel-end-text{max-width:1040px;margin:0 auto}
.panel-root *{font-variant-numeric:lining-nums}

@container (max-width:600px){
  .panel-strip{grid-template-columns:minmax(0,1fr)}
  .panel-facts{display:block}
  .panel-facts dd{margin:1px 0 13px}
  .panel-btn{flex:1;min-width:0}
}
`;

  function h(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function cell(content, caption, real) {
    const f = h("figure", "panel-cell");
    const frame = h("div", "panel-frame" + (real ? " panel-real" : ""));
    frame.append(content);
    f.append(frame);
    if (caption) f.append(h("figcaption", "panel-caption", caption));
    return f;
  }

  function image(src, alt) {
    const b = document.createElement("img");
    b.src = src;
    b.alt = alt;
    b.loading = "lazy";
    b.decoding = "async";
    b.addEventListener("error", () => {
      /* A missing image should not stay on the page as a broken icon. */
      b.replaceWith(h("div", "panel-text-only", "Image missing"));
    }, { once: true });
    return b;
  }

  function strip(p) {
    const s = h("div", "panel-strip");
    p.imageUrls.forEach((src, i) => s.append(cell(image(src, ""), p.captions[i])));
    // The fourth panel: the real thing if there is one, otherwise the sentence itself as the picture.
    if (p.realImageUrl) s.append(cell(image(p.realImageUrl, p.captions[3]), p.captions[3], true));
    else s.append(cell(h("div", "panel-text-only", p.captions[3]), null));
    return s;
  }

  function facts(p) {
    const dl = h("dl", "panel-facts");
    const row = (title, content) => {
      const dd = h("dd");
      dd.append(content);
      dl.append(h("dt", "", title), dd);
    };
    row("What it is about", p.about);
    if (A.hasCost(p)) row("Cost", "Estimated " + A.cost(p.cost) + "." + (p.costNote ? " " + p.costNote : ""));
    row("Against my proposal", p.counter);
    row("My proposal", A.label(p, p.proposal) + ". " + p.proposalWhy);

    const choice = h("div", "panel-choice");
    choice.setAttribute("role", "group");
    choice.setAttribute("aria-label", "Your answer to: " + p.title);
    A.answers(p).forEach(([w, text]) => {
      const b = h("button", "panel-btn", text);
      b.type = "button";
      b.dataset.id = p.id;
      b.dataset.value = w;
      b.setAttribute("aria-pressed", String(State.value(p.id) === w));
      b.onclick = () => State.set(p.id, State.value(p.id) === w ? null : w);
      choice.append(b);
    });
    row("Your answer", choice);
    return dl;
  }

  function item(p) {
    const withImages = p.imageUrls && p.imageUrls.length === 3;
    const a = h("article", "panel-item" + (withImages ? "" : " panel-textcard"));
    a.append(h("h2", "panel-title", p.nr + ". " + p.title));
    if (withImages) a.append(strip(p));
    a.append(facts(p));
    return a;
  }

  A.build.panels = function (el) {
    const root = h("div", "panel-root");
    root.append(h("style", "", CSS));

    const paper = h("div", "panel-paper");
    const column = h("div", "panel-column");
    column.append(h("p", "panel-legend", (A.panels && A.panels.legend ? A.panels.legend + " " : "") + "Three pictures tell the story, the fourth shows the real thing."));
    A.items.forEach((p) => column.append(item(p)));
    paper.append(column);

    const end = h("div", "panel-end");
    const endText = h("div", "panel-end-text");
    end.append(endText);
    root.append(paper, end);
    el.append(root);
    A.end(endText, "panels");

    const buttons = root.querySelectorAll(".panel-btn");
    const off = State.on(() => {
      if (!root.isConnected) return off(); // way left, the page rebuilds the stage
      buttons.forEach((b) => b.setAttribute("aria-pressed", String(State.value(b.dataset.id) === b.dataset.value)));
    });
  };
})();
</script>
<script>/* ways/car.js */
/* Way "In the Car": one piece per item. If there is audio, the page plays it (the next button skips).
   Without audio it shows the script: exactly what the voice would say. */
(function () {
  const A = window.A;
  const esc = A.esc;
  /* Round to whole seconds first, then divide: otherwise 59.7 s turns into "0:60". */
  const time = (s) => {
    const t = Math.round(s);
    return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
  };

  const CSS = `
.car-wrap{min-height:100%;background:#12181B;color:#EDF1EF;padding:clamp(22px,4vh,44px) clamp(16px,4vw,44px) 70px}
.car-h{font-size:clamp(34px,5vw,54px);line-height:1.05;margin:0 0 8px;font-weight:700;letter-spacing:-.02em}
.car-sub{font-size:18px;color:#B8C4C0;margin:0 0 26px;max-width:58ch}
.car-player{background:#1E282D;border-radius:14px;padding:18px 20px;margin:0 0 22px;max-width:760px}
.car-now{font-size:15px;color:#B8C4C0;margin:0}
.car-title{font-size:clamp(25px,3.6vw,38px);font-weight:700;margin:4px 0 12px;line-height:1.15}
.car-keys{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.car-keys button{height:58px;min-width:96px;padding:0 20px;border-radius:10px;border:0;background:#2C383E;color:#fff;font-size:19px;font-weight:600}
.car-keys button.car-big{background:#E8B25C;color:#1c1608;min-width:150px}
.car-bar{height:6px;background:rgba(255,255,255,.14);border-radius:3px;margin-top:14px;overflow:hidden}
.car-bar i{display:block;height:100%;width:0;background:#E8B25C}
.car-info{font-size:15px;color:#B8C4C0;margin:10px 0 0}
.car-list{list-style:none;margin:0 0 30px;padding:0;max-width:760px}
.car-list li{display:flex;gap:12px;align-items:center;padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.09);flex-wrap:wrap}
.car-list li.on{background:rgba(232,178,92,.12);border-radius:8px}
.car-list button.car-row{flex:1 1 220px;text-align:left;background:none;border:0;color:inherit;padding:0;font-size:17px;min-width:0}
.car-dur{font-size:14px;color:#9AA7A3;font-variant-numeric:tabular-nums}
.car-ans{display:flex;flex-wrap:wrap;gap:6px}
.car-ans button{border:1px solid rgba(255,255,255,.28);background:none;color:#fff;border-radius:6px;padding:3px 10px;font-size:14px}
.car-ans button[aria-pressed=true]{background:#5ECFA0;color:#12201A;border-color:#5ECFA0}
.car-box{background:#1E282D;border-radius:14px;padding:18px 20px;max-width:760px;margin:0 0 22px}
.car-box h3{margin:0 0 8px;font-size:20px}
.car-box p{margin:0 0 8px;font-size:16px;color:#D5DDD9}
.car-box p:last-child{margin-bottom:0}
.car-book{list-style:none;margin:0 0 30px;padding:0;max-width:760px}
.car-piece{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.09)}
.car-piece h3{margin:0 0 6px;font-size:18px}
.car-part{margin:0 0 6px;font-size:16.5px;line-height:1.5;color:#E3E9E6}
.car-part.b{padding-left:12px;border-left:3px solid #E8B25C;color:#F3DDB4}
.car-piece .car-ans{margin-top:8px}
.car-end{max-width:760px}
`;

  function answerButtons(p) {
    return '<span class="car-ans" role="group" aria-label="Your answer to: ' + esc(p.short) + '">'
      + A.answers(p).map(([w, t]) => '<button type="button" data-id="' + esc(p.id) + '" data-w="' + esc(w) + '">' + esc(t) + "</button>").join("") + "</span>";
  }

  function safe() {
    return '<section class="car-box"><h3>Safe on the road</h3>'
      + "<p>Only listen while driving, answer once you have parked. On the AAA distraction scale, listening to an audiobook rates 1.75 out of 5, dictating an email by voice 3.06. After a voice action, the distraction lasts up to 27 seconds.</p>"
      + "<p>Once you have parked, one sentence is enough, spoken or typed, for example: “1 yes, 2 later, 3 no”.</p></section>";
  }

  /* Without audio: read the script. This way you check what the voice will say and can still answer. */
  function scriptView(el) {
    const pieces = A.car.script;
    el.innerHTML = "<style>" + CSS + '</style><div class="car-wrap"><h1 class="car-h">In the Car</h1>'
      + '<p class="car-sub">' + esc(A.car.note || "No audio yet. This is what the voice would say, piece by piece.") + "</p>"
      + '<ol class="car-book"></ol>' + safe() + '<div class="car-end"></div></div>';
    const book = el.querySelector(".car-book");
    pieces.forEach((s) => {
      const li = document.createElement("li");
      li.className = "car-piece";
      const p = s.id ? A.item(s.id) : null;
      li.innerHTML = "<h3>" + esc(s.title) + "</h3>"
        + s.parts.map((t) => '<p class="car-part' + (t.voice === "b" ? " b" : "") + '">' + esc(t.text) + "</p>").join("")
        + (p ? answerButtons(p) : "");
      book.append(li);
    });
  }

  /* With audio: play, the next button skips, every piece makes sense on its own. */
  function player(el) {
    const PIECES = A.car.pieces;
    const total = PIECES.reduce((a, s) => a + (s.duration || 0), 0);
    el.innerHTML = "<style>" + CSS + '</style><div class="car-wrap"><h1 class="car-h">In the Car</h1>'
      + '<p class="car-sub">' + PIECES.length + " pieces to listen to, " + time(total) + " in total." + (A.car.voice ? " Voice: " + esc(A.car.voice) + "." : "") + "</p>"
      + '<div class="car-player"><p class="car-now" id="car-nr">Ready</p><div class="car-title" id="car-title"></div>'
      + '<div class="car-keys"><button type="button" id="car-back">Back</button><button type="button" id="car-play" class="car-big">Play</button><button type="button" id="car-next">Next</button></div>'
      + '<div class="car-bar"><i id="car-progress"></i></div>'
      + '<p class="car-info">The next button on the steering wheel or the keyboard skips to the next piece while the page plays. Test it once while parked.</p></div>'
      + '<ol class="car-list" id="car-list"></ol>' + safe() + '<div class="car-end"></div></div>';

    const $ = (s) => el.querySelector(s);
    const list = $("#car-list");
    PIECES.forEach((s, i) => {
      const li = document.createElement("li");
      const p = s.id ? A.item(s.id) : null;
      li.innerHTML = '<button type="button" class="car-row"></button><span class="car-dur">' + time(s.duration || 0) + "</span>" + (p ? answerButtons(p) : "");
      li.querySelector(".car-row").textContent = s.title;
      li.querySelector(".car-row").onclick = () => play(i, true);
      list.append(li);
    });

    const audio = new Audio();
    audio.preload = "none";
    let now = 0;
    function draw() {
      list.querySelectorAll("li").forEach((li, i) => li.classList.toggle("on", i === now));
      $("#car-title").textContent = PIECES[now].title;
      $("#car-nr").textContent = "Piece " + (now + 1) + " of " + PIECES.length;
      $("#car-play").textContent = audio.paused ? "Play" : "Pause";
    }
    /* A new piece cuts off one that is still starting (AbortError). That is not an error and does not belong at the wheel. */
    const reportError = (e) => { if (!e || e.name !== "AbortError") A.notify("The file could not be played."); };
    function play(i, go) {
      now = Math.max(0, Math.min(PIECES.length - 1, i));
      audio.src = PIECES[now].url;
      if (go) audio.play().catch(reportError);
      draw();
    }
    audio.addEventListener("timeupdate", () => { if (audio.duration) $("#car-progress").style.width = (audio.currentTime / audio.duration) * 100 + "%"; });
    audio.addEventListener("play", draw);
    audio.addEventListener("pause", draw);
    audio.addEventListener("ended", () => {
      if (now < PIECES.length - 1) play(now + 1, true);
      else draw();
    });
    $("#car-play").onclick = () => {
      if (!audio.getAttribute("src")) play(now, true);
      else if (audio.paused) audio.play().catch(reportError);
      else audio.pause();
    };
    /* Next after the last piece stops instead of restarting the skipped piece. */
    const next = () => (now < PIECES.length - 1 ? play(now + 1, true) : audio.pause());
    $("#car-next").onclick = next;
    $("#car-back").onclick = () => play(now - 1, true);

    /* Media keys: buttons on the steering wheel and the keyboard go through this while the page plays. */
    if ("mediaSession" in navigator) {
      navigator.mediaSession.setActionHandler("nexttrack", next);
      navigator.mediaSession.setActionHandler("previoustrack", () => play(now - 1, true));
    }
    /* When you leave the way, the voice stops and the media keys are free again. */
    A.onLeave(() => {
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
      if ("mediaSession" in navigator) {
        navigator.mediaSession.setActionHandler("nexttrack", null);
        navigator.mediaSession.setActionHandler("previoustrack", null);
      }
    });
    draw();
  }

  A.build.car = function (el) {
    if (A.car.pieces && A.car.pieces.length) player(el);
    else scriptView(el);
    const buttons = () => el.querySelectorAll(".car-ans [data-w]").forEach((b) => b.setAttribute("aria-pressed", String(State.value(b.dataset.id) === b.dataset.w)));
    el.addEventListener("click", (e) => {
      const b = e.target.closest(".car-ans [data-w]");
      if (!b) return;
      State.set(b.dataset.id, State.value(b.dataset.id) === b.dataset.w ? null : b.dataset.w);
    });
    buttons();
    const off = State.on(() => (el.isConnected ? buttons() : off()));
    A.onLeave(off);
    A.end(el.querySelector(".car-end"), "car");
  };
})();
</script>
<script>/* frame.js */
/* Frame: head bar with the ways, overview with all items, closing of every way.
   Runs as the last script, after every way has registered its A.build[id]. */
(function () {
  const A = window.A;
  const $ = (id) => document.getElementById(id);
  const esc = A.esc;
  const TARGET = "into your session “" + A.session + "”";
  const COPIED = "Text copied. Now paste it " + TARGET + ".";
  const ways = A.WAYS.filter((w) => A.ways.includes(w.id) && A.build[w.id]);
  let active = null;

  document.title = A.title;
  $("head-title").textContent = A.title;
  $("band").textContent = A.about;
  /* The head bar sticks to the top. Ways that pin something to the top themselves count with its height. */
  new ResizeObserver(() => document.documentElement.style.setProperty("--a-head", $("head").offsetHeight + "px")).observe($("head"));

  A.notify = function (text) {
    const t = $("toast");
    t.textContent = text;
    t.classList.add("on");
    clearTimeout(A.notify.z);
    A.notify.z = setTimeout(() => t.classList.remove("on"), 2400);
  };

  /* Closing of every way: the one text for the chat, and how the way felt. */
  A.end = function (el, way) {
    el.classList.add("a-end");
    function draw() {
      el.innerHTML = "<div>This is your answer so far:</div><pre></pre>"
        + '<div class="a-end-buttons"><button type="button" data-k>Copy text</button></div>'
        + (way ? '<div class="a-end-buttons a-end-rating"><span>How was this way?</span>'
          + ["pleasant", "okay", "annoying"].map((r) => '<button type="button" data-r="' + r + '" aria-pressed="' + (State.wayRating(way) === r) + '">' + r + "</button>").join("")
          + "</div>" : "")
        + "<small>Only marked, it counts once it is in the chat. Paste the text " + esc(TARGET) + " or say it there.</small>";
      el.querySelector("pre").textContent = State.text();
      el.querySelector("[data-k]").onclick = async () => A.notify((await State.copy()) ? COPIED : "Copying did not work. Select the text above and copy it.");
      el.querySelectorAll("[data-r]").forEach((b) => (b.onclick = () => {
        State.rateWay(way, State.wayRating(way) === b.dataset.r ? null : b.dataset.r);
        draw();
      }));
    }
    draw();
    /* The text stays current, even while answers change further up. */
    if (el._aOff) el._aOff();
    el._aOff = State.on(() => {
      if (!el.isConnected) return el._aOff();
      el.querySelector("pre").textContent = State.text();
    });
  };

  /* A way registers here what has to stop when you leave it (for example playback). */
  let cleanup = [];
  A.onLeave = (f) => cleanup.push(f);
  function leave() {
    cleanup.splice(0).forEach((f) => {
      try { f(); } catch (e) { /* an error while cleaning up must not block the switch */ }
    });
  }

  function bar() {
    const button = (id, text) => '<button type="button" data-way="' + id + '"' + (active === id ? ' aria-current="page"' : "") + ">" + esc(text) + "</button>";
    $("head-ways").innerHTML = button("", "Overview") + ways.map((w) => button(w.id, w.title)).join("");
    $("head-ways").querySelectorAll("[data-way]").forEach((b) => (b.onclick = () => (b.dataset.way ? show(b.dataset.way) : overview())));
    $("head-count").textContent = State.count() + " of " + A.items.length + " answered";
  }

  function show(id) {
    leave();
    active = id;
    if (location.hash.slice(1) !== id) location.hash = id;
    $("band").hidden = false;
    const stage = $("stage");
    stage.replaceChildren();
    const b = document.createElement("div");
    stage.append(b);
    window.scrollTo(0, 0);
    try {
      A.build[id](b);
    } catch (e) {
      b.className = "a-error";
      b.textContent = "This way has an error: " + e.message;
    }
    bar();
  }

  function itemRow(p) {
    const li = document.createElement("li");
    li.className = "a-item";
    /* Opened up, this shows everything the content knows about the item. The proposal comes last, it should not steer. */
    const more = [
      ["You know this", p.familiar],
      ["Today", p.now],
      ["After", p.after],
      ["For", p.why],
      ["What could go wrong", p.risk],
      ["What you might regret", p.regret],
      ["Evidence", p.evidence],
      ["Cost", A.hasCost(p) ? "Estimated " + A.cost(p.cost) + "." + (p.costNote ? " " + p.costNote : "") : p.costNote],
      ["You said before", p.conflict],
      ["If yes", p.ifYes],
      ["If no", p.ifNo],
      ["Against my proposal", p.counter],
      ["My proposal", A.label(p, p.proposal) + ". " + p.proposalWhy],
    ].filter(([, t]) => t);
    li.innerHTML = '<div class="a-item-text"><h3 id="a-p-' + esc(p.id) + '"><span class="a-nr">' + p.nr + "</span>" + esc(p.short) + "</h3>"
      + "<p><strong>" + esc(p.title) + ".</strong> " + esc(p.about) + "</p>"
      + "<details><summary>More, and my proposal</summary>"
      + more.map(([title, t]) => "<p><strong>" + esc(title) + ":</strong> " + esc(t) + "</p>").join("") + "</details></div>"
      + '<div class="a-choice" role="group" aria-labelledby="a-p-' + esc(p.id) + '">'
      + A.answers(p).map(([w, t]) => '<button type="button" data-w="' + esc(w) + '">' + esc(t) + "</button>").join("") + "</div>";
    li.querySelectorAll("[data-w]").forEach((b) => (b.onclick = () => State.set(p.id, State.value(p.id) === b.dataset.w ? null : b.dataset.w)));
    return li;
  }

  function overview() {
    leave();
    active = "";
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
    $("band").hidden = true;
    const stage = $("stage");
    const s = document.createElement("div");
    s.className = "a-start";
    const n = A.items.length;
    s.innerHTML = "<h1>" + esc(A.title) + "</h1>"
      + '<p class="a-lead">' + esc(A.about) + "</p>"
      + "<p>" + (n === 1 ? "1 item is" : n + " items are") + " open here. Pick the way that suits you right now. The content is the same everywhere, and your answers travel with you from way to way.</p>"
      + (ways.length ? '<div class="a-ways">' + ways.map((w) => '<button type="button" class="a-way" data-way="' + w.id + '"><span class="a-way-title">' + esc(w.title)
        + '</span><span class="a-way-when">' + esc(w.when) + '</span><span class="a-way-does">' + esc(w.does) + "</span></button>").join("") + "</div>" : "")
      + "<h2>All items at a glance</h2>"
      + '<ol class="a-items"></ol>'
      + (A.committed && A.committed.length ? "<details class=\"a-committed\"><summary>Coming anyway, already promised</summary><ul>"
        + A.committed.map((z) => "<li><strong>" + esc(z.name) + ".</strong> " + esc(z.text) + (z.cost && A.unit ? " Estimated " + esc(A.cost(z.cost)) + "." : "") + "</li>").join("") + "</ul></details>" : "")
      + '<section class="a-start-end"></section>'
      + '<p class="a-small">As of ' + esc(A.date) + ". All costs are estimates. Clicks only mark things, what counts is what you paste " + esc(TARGET) + ". Your answers never leave this computer.</p>";
    const ol = s.querySelector(".a-items");
    A.items.forEach((p) => ol.append(itemRow(p)));
    s.querySelectorAll(".a-way").forEach((b) => (b.onclick = () => show(b.dataset.way)));
    stage.replaceChildren(s);
    A.end(s.querySelector(".a-start-end"), null);
    const buttons = () => s.querySelectorAll(".a-item [data-w]").forEach((b) => {
      const id = b.closest(".a-item").querySelector("h3").id.slice(4);
      b.setAttribute("aria-pressed", String(State.value(id) === b.dataset.w));
    });
    buttons();
    const off = State.on(() => (s.isConnected ? buttons() : off()));
    window.scrollTo(0, 0);
    bar();
  }

  $("head-copy").onclick = async () => A.notify((await State.copy()) ? COPIED : "Copying did not work.");
  State.on(() => { $("head-count").textContent = State.count() + " of " + A.items.length + " answered"; });
  window.addEventListener("hashchange", () => {
    const id = location.hash.slice(1);
    if (id && id !== active && ways.some((w) => w.id === id)) show(id);
    else if (!id && active) overview();
  });
  const id = location.hash.slice(1) || A.start || "";
  if (id && ways.some((w) => w.id === id)) show(id);
  else overview();
})();
</script>
</body>
